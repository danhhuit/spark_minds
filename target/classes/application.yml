spring:
  config:
    import: optional:file:.env[.properties]

  # .env is imported as a properties file, therefore the environment-style
  # variable must be mapped explicitly to Spring's profile property.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}

  application:
    name: library-management
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:false}
            required: ${MAIL_STARTTLS_REQUIRED:false}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  server:
    tomcat-protocol: ${TOMCAT_PROTOCOL:org.apache.coyote.http11.Http11Nio2Protocol}

  frontend-url: ${FRONTEND_URL:http://localhost:8080}
  backend-url: ${BACKEND_URL:http://localhost:8080}
  mail-from: ${MAIL_FROM:no-reply@library.local}

  admin:
    username: ${ADMIN_USERNAME}
    password: ${ADMIN_PASSWORD}
    email: ${ADMIN_EMAIL}

  jwt:
    issuer: library-management
    secret: ${JWT_SECRET}

  # All durations are configured and interpreted in seconds.
  time-to-live:
    # 15 minutes
    access-token-seconds: ${ACCESS_TOKEN_SECONDS:900}
    # 7 days
    refresh-token-seconds: ${REFRESH_TOKEN_SECONDS:604800}
    # 24 hours
    email-verification-seconds: ${EMAIL_VERIFICATION_SECONDS:86400}
    # 30 minutes
    password-reset-seconds: ${PASSWORD_RESET_SECONDS:1800}
    # 10 minutes
    email-change-verification-seconds: ${EMAIL_CHANGE_VERIFICATION_SECONDS:600}
    # 2 minutes
    social-login-code-seconds: ${SOCIAL_LOGIN_CODE_SECONDS:120}
    # 14 days
    borrowing-seconds: ${BORROWING_SECONDS:1209600}

server:
  port: 8080
