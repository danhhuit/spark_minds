databaseChangeLog:
  - changeSet:
      id: 009-create-email-change-verifications
      author: danh
      changes:
        - createTable:
            tableName: email_change_verifications
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_email_change_verifications
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: new_email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: code_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: expires_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: attempts
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

              - column:
                  name: used
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: used_at
                  type: TIMESTAMP WITH TIME ZONE

        - addForeignKeyConstraint:
            baseTableName: email_change_verifications
            baseColumnNames: user_id
            referencedTableName: user_accounts
            referencedColumnNames: id
            constraintName: fk_email_change_verifications_user
            onDelete: CASCADE

        - createIndex:
            tableName: email_change_verifications
            indexName: idx_email_change_verifications_user
            columns:
              - column:
                  name: user_id

        - createIndex:
            tableName: email_change_verifications
            indexName: idx_email_change_verifications_expires
            columns:
              - column:
                  name: expires_at