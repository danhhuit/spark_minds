databaseChangeLog:
  - changeSet:
      id: 005-create-auth-token-tables
      author: danh
      changes:
        - createTable:
            tableName: refresh_tokens
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_refresh_tokens
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: token_hash
                  type: CHAR(64)
                  constraints:
                    nullable: false

              - column:
                  name: expires_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: revoked
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: revoked_at
                  type: TIMESTAMP WITH TIME ZONE

        - addUniqueConstraint:
            tableName: refresh_tokens
            columnNames: token_hash
            constraintName: uk_refresh_tokens_token_hash

        - addForeignKeyConstraint:
            baseTableName: refresh_tokens
            baseColumnNames: user_id
            referencedTableName: user_accounts
            referencedColumnNames: id
            constraintName: fk_refresh_tokens_user
            onDelete: CASCADE

        - createIndex:
            tableName: refresh_tokens
            indexName: idx_refresh_tokens_user_id
            columns:
              - column:
                  name: user_id

        - createIndex:
            tableName: refresh_tokens
            indexName: idx_refresh_tokens_expires_at
            columns:
              - column:
                  name: expires_at

        - createTable:
            tableName: revoked_tokens
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_revoked_tokens
                    nullable: false

              - column:
                  name: jti
                  type: VARCHAR(64)
                  constraints:
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: expires_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: revoked_tokens
            columnNames: jti
            constraintName: uk_revoked_tokens_jti

        - addForeignKeyConstraint:
            baseTableName: revoked_tokens
            baseColumnNames: user_id
            referencedTableName: user_accounts
            referencedColumnNames: id
            constraintName: fk_revoked_tokens_user
            onDelete: CASCADE

        - createIndex:
            tableName: revoked_tokens
            indexName: idx_revoked_tokens_expires_at
            columns:
              - column:
                  name: expires_at