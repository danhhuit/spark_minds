databaseChangeLog:
  - changeSet:
      id: 011-create-borrowings
      author: danh
      changes:
        - createTable:
            tableName: borrowings
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_borrowings
                    nullable: false

              - column:
                  name: member_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: book_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: borrowed_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: due_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: returned_at
                  type: TIMESTAMP WITH TIME ZONE

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: borrowings
            baseColumnNames: member_id
            referencedTableName: member_profiles
            referencedColumnNames: id
            constraintName: fk_borrowings_member

        - addForeignKeyConstraint:
            baseTableName: borrowings
            baseColumnNames: book_id
            referencedTableName: books
            referencedColumnNames: id
            constraintName: fk_borrowings_book

        - createIndex:
            tableName: borrowings
            indexName: idx_borrowings_member_status
            columns:
              - column:
                  name: member_id
              - column:
                  name: status

        - createIndex:
            tableName: borrowings
            indexName: idx_borrowings_book_status
            columns:
              - column:
                  name: book_id
              - column:
                  name: status

        - createIndex:
            tableName: borrowings
            indexName: idx_borrowings_due_at
            columns:
              - column:
                  name: due_at

        - sql:
            sql: >
              ALTER TABLE borrowings
              ADD CONSTRAINT ck_borrowings_status
              CHECK (status IN ('BORROWED', 'RETURNED'))

        - sql:
            sql: >
              CREATE UNIQUE INDEX
              uk_borrowings_one_active_per_member
              ON borrowings(member_id)
              WHERE status = 'BORROWED'