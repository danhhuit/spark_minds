databaseChangeLog:
  - changeSet:
      id: 013-create-saved-books
      author: codex
      changes:
        - createTable:
            tableName: saved_books
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_saved_books
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: book_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: saved_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: saved_books
            columnNames: user_id, book_id
            constraintName: uk_saved_books_user_book

        - addForeignKeyConstraint:
            baseTableName: saved_books
            baseColumnNames: user_id
            referencedTableName: user_accounts
            referencedColumnNames: id
            constraintName: fk_saved_books_user
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: saved_books
            baseColumnNames: book_id
            referencedTableName: books
            referencedColumnNames: id
            constraintName: fk_saved_books_book
            onDelete: CASCADE

        - createIndex:
            tableName: saved_books
            indexName: idx_saved_books_user_saved_at
            columns:
              - column:
                  name: user_id
              - column:
                  name: saved_at

        - createIndex:
            tableName: saved_books
            indexName: idx_saved_books_book
            columns:
              - column:
                  name: book_id

      rollback:
        - dropTable:
            tableName: saved_books
            cascadeConstraints: true
