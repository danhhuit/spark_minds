spring:
  main:
    banner-mode: off

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: google-test-client-id
            client-secret: google-test-client-secret
            scope:
              - openid
              - profile
              - email

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  mail:
    host: localhost
    port: 1025

app:
  server:
    tomcat-protocol: org.apache.coyote.http11.Http11Nio2Protocol

  oauth2:
    google:
      enabled: true

  jwt:
    issuer: library-management-test
    secret: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=

  time-to-live:
    access-token-seconds: 900
    refresh-token-seconds: 604800
    email-verification-seconds: 86400
    password-reset-seconds: 1800
    email-change-verification-seconds: 600
    social-login-code-seconds: 120
    borrowing-seconds: 1209600

  admin:
    username: admin
    password: admin
    email: admin@library.test

logging:
  level:
    root: WARN
    com.sparkminds.library: INFO
    com.sparkminds.library.common.logging: OFF
