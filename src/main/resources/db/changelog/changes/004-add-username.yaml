databaseChangeLog:
  - changeSet:
      id: 004-add-username
      author: danh
      changes:
        - addColumn:
            tableName: user_accounts
            columns:
              - column:
                  name: username
                  type: VARCHAR(255)

        - sql:
            sql: >
              UPDATE user_accounts
              SET username = email
              WHERE username IS NULL

        - addNotNullConstraint:
            tableName: user_accounts
            columnName: username
            columnDataType: VARCHAR(255)

        - addUniqueConstraint:
            tableName: user_accounts
            columnNames: username
            constraintName: uk_user_accounts_username
