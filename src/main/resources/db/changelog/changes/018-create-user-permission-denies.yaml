databaseChangeLog:
  - changeSet:
      id: 018-create-user-permission-denies
      author: codex
      changes:
        - createTable:
            tableName: user_denied_permissions
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: permission_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addPrimaryKey:
            tableName: user_denied_permissions
            columnNames: user_id, permission_id
            constraintName: pk_user_denied_permissions

        - addForeignKeyConstraint:
            baseTableName: user_denied_permissions
            baseColumnNames: user_id
            referencedTableName: user_accounts
            referencedColumnNames: id
            constraintName: fk_user_denied_permissions_user
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: user_denied_permissions
            baseColumnNames: permission_id
            referencedTableName: permissions
            referencedColumnNames: id
            constraintName: fk_user_denied_permissions_permission
            onDelete: CASCADE
