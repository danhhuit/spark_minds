databaseChangeLog:
  - changeSet:
      id: 012-create-system-config
      author: danh
      changes:
        - createTable:
            tableName: system_configs
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_system_configs
                    nullable: false

              - column:
                  name: maintenance_mode
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

              - column:
                  name: maintenance_message
                  type: VARCHAR(500)
                  constraints:
                    nullable: false

              - column:
                  name: updated_by
                  type: VARCHAR(255)

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - insert:
            tableName: system_configs
            columns:
              - column:
                  name: id
                  valueNumeric: 1
              - column:
                  name: maintenance_mode
                  valueBoolean: false
              - column:
                  name: maintenance_message
                  value: "System is under maintenance. Please try again later."
