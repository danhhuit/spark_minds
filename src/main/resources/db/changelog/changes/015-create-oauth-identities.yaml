databaseChangeLog:
  - changeSet:
      id: 015-create-oauth-identities
      author: danh
      changes:
        - createTable:
            tableName: oauth_identities
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: provider
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: provider_subject
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: oauth_identities
            baseColumnNames: user_id
            referencedTableName: user_accounts
            referencedColumnNames: id
            constraintName: fk_oauth_identities_user
            onDelete: CASCADE

        - addUniqueConstraint:
            tableName: oauth_identities
            columnNames: provider, provider_subject
            constraintName: uk_oauth_provider_subject

        - addUniqueConstraint:
            tableName: oauth_identities
            columnNames: user_id, provider
            constraintName: uk_oauth_user_provider
