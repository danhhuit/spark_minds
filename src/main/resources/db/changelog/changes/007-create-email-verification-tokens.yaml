databaseChangeLog:
  - changeSet:
      id: 007-create-email-verification-tokens
      author: danh
      changes:
        - createTable:
            tableName: email_verification_tokens
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_email_verification_tokens
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: token_hash
                  type: VARCHAR(64)
                  constraints:
                    nullable: false

              - column:
                  name: expires_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: used
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: used_at
                  type: TIMESTAMP WITH TIME ZONE

        - addUniqueConstraint:
            tableName: email_verification_tokens
            columnNames: token_hash
            constraintName: uk_email_verification_token_hash

        - addForeignKeyConstraint:
            baseTableName: email_verification_tokens
            baseColumnNames: user_id
            referencedTableName: user_accounts
            referencedColumnNames: id
            constraintName: fk_email_verification_tokens_user
            onDelete: CASCADE

        - createIndex:
            tableName: email_verification_tokens
            indexName: idx_email_verification_tokens_user
            columns:
              - column:
                  name: user_id

        - createIndex:
            tableName: email_verification_tokens
            indexName: idx_email_verification_tokens_expires
            columns:
              - column:
                  name: expires_at