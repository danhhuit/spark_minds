databaseChangeLog:
  - changeSet:
      id: 001-create-roles
      author: danh
      changes:
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_roles
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: roles
            columnNames: name
            constraintName: uk_roles_name

        - insert:
            tableName: roles
            columns:
              - column:
                  name: name
                  value: ADMIN

        - insert:
            tableName: roles
            columns:
              - column:
                  name: name
                  value: USER