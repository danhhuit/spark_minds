spring:
  application:
    name: library-management
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - openid
              - profile
              - email
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5433/library_db}
    username: ${DB_USERNAME:library_user}
    password: ${DB_PASSWORD:library_password}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:false}
            required: ${MAIL_STARTTLS_REQUIRED:false}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  frontend-url: ${FRONTEND_URL:http://localhost:8080}
  backend-url: ${BACKEND_URL:http://localhost:8080}
  mail-from: ${MAIL_FROM:no-reply@library.local}

  borrowing:
    default-loan-days: ${DEFAULT_LOAN_DAYS:14}

  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin}
    email: ${ADMIN_EMAIL:admin@library.local}

  jwt:
    issuer: library-management
    secret: ${JWT_SECRET}
    access-token-minutes: 15
    refresh-token-days: 7

server:
  port: 8080
